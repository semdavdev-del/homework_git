<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Products</title>
      <style>
            * {
                  box-sizing: border-box;
            }

            body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background: linear-gradient(135deg, #f5f7ff, #edf3ff);
                  font-family: Arial, sans-serif;
            }

            .product-card {
                  width: 340px;
                  background: #fff;
                  border-radius: 20px;
                  overflow: hidden;
                  box-shadow: 0 16px 35px rgba(31, 41, 55, 0.12);
                  transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            .product-card:hover {
                  transform: translateY(-5px);
                  box-shadow: 0 20px 40px rgba(31, 41, 55, 0.18);
            }

            .product-image {
                  height: 200px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: linear-gradient(135deg, #4f46e5, #7c3aed);
                  color: #fff;
                  font-size: 52px;
                  font-weight: bold;
            }

            .product-content {
                  padding: 22px 20px 24px;
            }

            .product-tag {
                  display: inline-block;
                  background: #eef2ff;
                  color: #4338ca;
                  padding: 6px 10px;
                  border-radius: 999px;
                  font-size: 12px;
                  font-weight: 700;
                  letter-spacing: 0.5px;
            }

            .product-title {
                  margin: 14px 0 10px;
                  font-size: 28px;
                  color: #111827;
            }

            .product-desc {
                  margin: 0 0 18px;
                  color: #6b7280;
                  line-height: 1.6;
                  font-size: 15px;
            }

            .product-footer {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
            }

            .price {
                  font-size: 26px;
                  font-weight: 700;
                  color: #111827;
            }

            .buy-btn {
                  text-decoration: none;
                  background: #4f46e5;
                  color: white;
                  padding: 10px 16px;
                  border-radius: 10px;
                  font-weight: 700;
                  transition: background 0.2s ease;
            }

            .buy-btn:hover {
                  background: #4338ca;
            }
      </style>
</head>

<body>
      <div class="product-card">
            <div class="product-image">P</div>
            <div class="product-content">
                  <span class="product-tag">BEST SELLER</span>
                  <h2 class="product-title">Premium Headphones</h2>
                  <p class="product-desc">
                        High-quality sound, comfortable fit, and a sleek design for everyday listening.
                  </p>
                  <div class="product-footer">
                        <div class="price">$149</div>
                        <a href="#" class="buy-btn">Add to cart</a>
                  </div>
            </div>
      </div>
</body>

</html>
