<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            width: 350px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .profile-card img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #eee;
            margin-bottom: 15px;
        }

        .profile-card h2 {
            font-size: 24px;
            color: #222;
            margin-bottom: 8px;
        }

        .profile-card .role {
            color: #777;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            padding: 12px;
            margin-bottom: 8px;
            background: #f7f7f7;
            border-radius: 10px;
            color: #444;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <!-- Profile Image -->
        <img src="man.png" alt="Profile Photo">

        <h2>Chan Koemsour</h2>

        <p class="role">Administrator</p>

        <div class="info">
            <p>📧 Email: admin@gmail.com</p>
            <p>📱 Phone: 012 345 678</p>
            <p>📍 Location: Phnom Penh</p>
        </div>

        <a href="#" class="btn">View Profile</a>

    </div>

</body>
</html>
