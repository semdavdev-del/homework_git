<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .login-container {
      width: 380px;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #1e293b;
    }

    .login-container .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    .input-box {
      margin-bottom: 20px;
    }

    .input-box label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: bold;
    }

    .input-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .input-box input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .options a {
      color: #2563eb;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      color: #64748b;
    }

    .signup a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 450px) {
      .login-container {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h1>Welcome Back</h1>
    <p class="subtitle">Please login to your account</p>

    <form>

      <div class="input-box">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="input-box">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <p class="signup">
      Don't have an account?
      <a href="#">Sign Up</a>
    </p>

  </div>

</body>
</html>
