<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Project Card</title>
      <style>
            * {
                  box-sizing: border-box;
            }

            body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background: linear-gradient(135deg, #f5f7ff, #eef6ff);
                  font-family: Arial, sans-serif;
            }

            .project-card {
                  width: 360px;
                  background: #ffffff;
                  border-radius: 22px;
                  overflow: hidden;
                  box-shadow: 0 16px 35px rgba(31, 41, 55, 0.12);
                  transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            .project-card:hover {
                  transform: translateY(-6px);
                  box-shadow: 0 20px 40px rgba(31, 41, 55, 0.18);
            }

            .project-image {
                  height: 200px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: linear-gradient(135deg, #2563eb, #7c3aed);
                  color: white;
                  font-size: 52px;
                  font-weight: bold;
            }

            .project-content {
                  padding: 22px 20px 24px;
            }

            .project-meta {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  color: #64748b;
                  font-size: 12px;
                  font-weight: 700;
                  text-transform: uppercase;
                  letter-spacing: 0.7px;
            }

            .project-title {
                  margin: 14px 0 10px;
                  font-size: 28px;
                  color: #111827;
            }

            .project-desc {
                  margin: 0 0 18px;
                  color: #6b7280;
                  line-height: 1.6;
                  font-size: 15px;
            }

            .project-footer {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
            }

            .project-status {
                  color: #059669;
                  font-weight: 700;
                  background: #ecfdf5;
                  padding: 7px 10px;
                  border-radius: 999px;
                  font-size: 12px;
            }

            .view-btn {
                  text-decoration: none;
                  background: #2563eb;
                  color: white;
                  padding: 10px 16px;
                  border-radius: 10px;
                  font-weight: 700;
                  transition: background 0.2s ease;
            }

            .view-btn:hover {
                  background: #1d4ed8;
            }
      </style>
</head>

<body>
      <div class="project-card">
            <div class="project-image">P</div>
            <div class="project-content">
                  <div class="project-meta">
                        <span>UI/UX</span>
                        <span>2026</span>
                  </div>
                  <h2 class="project-title">Portfolio Redesign</h2>
                  <p class="project-desc">
                        A clean portfolio concept focused on modern layout, typography, and smooth user interaction.
                  </p>
                  <div class="project-footer">
                        <span class="project-status">Completed</span>
                        <a href="#" class="view-btn">View Project</a>
                  </div>
            </div>
      </div>
</body>

</html>
